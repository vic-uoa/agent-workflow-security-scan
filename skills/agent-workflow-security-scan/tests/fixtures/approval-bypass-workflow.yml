app: {name: approval-branch-bypass}
workflow:
  graph:
    nodes:
      - id: start
        data:
          type: start
          normalization: NFKC
          variables:
            - {variable: resource_id, type: text-input, max_length: 100}
      - id: approve
        data:
          type: human-input
          title: 人工审批
          inputs:
            - {output_variable_name: resource_id, type: text-input, default: [start, resource_id]}
          actions:
            - {id: approve, title: 批准}
            - {id: reject, title: 拒绝}
      - id: delete_tool
        data:
          type: tool
          title: delete resource
          operation: delete
          business_purpose: approved-resource-retirement
          allowed_operations: [delete]
          resource_id: [approve, resource_id]
          timeout: 10
          authorization_policy: resource-owner-check
          input_schema:
            type: object
            properties: {resource_id: {type: string}}
            required: [resource_id]
            additionalProperties: false
      - id: answer
        data:
          type: end
          title: 结果
          outputs: {result: [approve, resource_id]}
          output_schema:
            type: object
            properties: {result: {type: string}}
            required: [result]
            additionalProperties: false
          fallback: fail_closed
    edges:
      - {id: e1, source: start, target: approve}
      - {id: e2, source: approve, target: delete_tool, sourceHandle: approve}
      - {id: e3, source: approve, target: delete_tool, sourceHandle: reject}
      - {id: e4, source: delete_tool, target: answer}
