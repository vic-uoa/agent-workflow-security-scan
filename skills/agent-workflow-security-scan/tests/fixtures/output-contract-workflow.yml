app:
  name: output-contract-workflow
  mode: workflow
workflow:
  graph:
    nodes:
      - id: start
        data:
          type: start
          title: 输入
          variables:
            - variable: query
              type: object
              required: true
      - id: end
        data:
          type: end
          title: 结构化输出
          outputs:
            - variable: result
              value_type: object
              value_selector: [start, query]
    edges:
      - {id: e1, source: start, target: end}
