kind: app
version: 0.7.0
app:
  name: dify-candidate-password-public-output
  mode: workflow
workflow:
  graph:
    nodes:
      - id: start
        data:
          type: start
          variables:
            - variable: password
              label: 账号密码
              type: text-input
              max_length: 200
      - id: end
        data:
          type: end
          audience: public
          outputs:
            password:
              value_selector: [start, password]
              value_type: string
    edges:
      - {id: e1, source: start, target: end}
