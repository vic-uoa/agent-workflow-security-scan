app: {name: parameter-precision}
workflow:
  graph:
    nodes:
      - id: start
        data:
          type: start
          normalization: NFKC
          variables:
            - {variable: message, type: text-input, max_length: 500}
      - id: validate
        data:
          type: if-else
          title: 确定性输入验证
          value: [start, message]
          allowlist: business-message-policy
          on_failure: block
          security_control: {type: validation, mandatory: true}
      - id: http
        data:
          type: http-request
          title: 固定内部审计接口
          method: POST
          url: "https://audit.internal.example/v1/events"
          body: "{{#validate.result#}}"
          timeout: 10
          payload_filter: business-message-policy
          input_schema:
            type: object
            properties: {body: {type: string}}
            required: [body]
            additionalProperties: false
      - id: answer
        data:
          type: end
          title: 结果
          outputs: {result: [http, status]}
          output_schema:
            type: object
            properties: {result: {type: string}}
            required: [result]
            additionalProperties: false
          fallback: fail_closed
    edges:
      - {id: e1, source: start, target: validate}
      - {id: e2, source: validate, target: http}
      - {id: e3, source: http, target: answer}
