kind: app
version: 0.7.0
app:
  name: dify-security-adjacent-credential
  mode: workflow
workflow:
  graph:
    nodes:
      - id: llm
        data:
          type: llm
          prompt_template:
            - role: system
              text: |
                安全规范：不得泄露或记录凭证。
                api_key=ABCDEFGH12345678
      - id: end
        data:
          type: end
          outputs:
            result:
              value_selector: [llm, text]
              value_type: string
    edges:
      - {id: e1, source: llm, target: end}
