schema_version: "1.0"
description: 每条静态规则的最小命中示例；示例用于解释判定逻辑，不代替动态验证。
examples:
  FLOW-001: "边 start→missing 的 target 不存在，命中结构断裂；仅缺少画布坐标不命中。"
  FLOW-002: "DSL 导出版本高于适配器支持版本，未知字段可能隐藏执行能力，只记录 COVERAGE_GAP。"
  FLOW-003: "用户输入经 LLM 直接到删除订单工具，且不存在必经授权门，形成高后果可达链。"
  FLOW-004: "已标记为身份证号的输入进入外部 webhook body，且无全路径脱敏，形成敏感数据外发风险。"
  FLOW-005: "外部网页正文进入 LLM，LLM 又能调用发信工具，恶意网页指令可间接驱动副作用。"
  FLOW-006: "审批节点的 rejected 分支仍可到达付款工具，确认存在审批旁路。"
  FLOW-007: "Dify loop 的 loop_count 为 0 或缺失，循环资源上限无效；iteration 不按此字段判定。"
  FLOW-008: "password 类型的 Start 变量被插入模型 Prompt，凭证成为模型可见上下文。"
  FLOW-009: "客户密钥与用户可控目标 URL 同时进入模型控制的 HTTP 写请求，构成完整外带通道。"
  FLOW-010: "LLM 输出被模板化写入 Code 节点的代码体并执行；固定 Python 仅解析输入 JSON 不命中。"
  FLOW-011: "Agent A 的自由文本消息直接交给 Agent B 且无消息 Schema 或来源绑定；普通 LLM 串联不适用。"
  FLOW-012: "扣款后再发券，两个副作用节点串联但无幂等键和补偿，重试可能造成重复执行。"
  FLOW-013: "自主 Agent 可连续调用删除工具，却没有目标锁定、最大步数或紧急停止条件。"
  FLOW-014: "上游声明输出 object，下游参数明确要求 string，类型契约确认不一致。"
  FLOW-015: "代码用正则从自由文本提取 status 并送入条件节点，但未拒绝重复字段或未知枚举。"
  FLOW-016: "条件 A 选择的 LLM 直接进入条件 B 选择的另一 LLM，形成跨互斥分支串行执行候选。"

  IN-001: "Start 自定义字段 order 缺少 type，而下游按对象消费，命中输入类型缺失。"
  IN-002: "未设置 max_length 的 records 被送入 iteration 并逐项调用工具，存在调用量放大。"
  IN-003: "文件输入允许任意扩展名且无大小、数量约束，恶意或超大文件可进入解析链。"
  IN-004: "用户输入直接作为资源路径且未规范化，%2e%2e%2f 等编码可能绕过目录检查。"
  IN-005: "JSON 输入 Schema 未设置 additionalProperties:false，隐藏字段可能被下游工具透传。"
  IN-006: "标记为手机号的输入可达外部短信插件日志，且没有可验证的脱敏或最小化控制。"
  IN-007: "system Prompt 写入‘输入：{{#start.content#}}’，用户数据进入高权限指令区，静态确认为 MEDIUM。"
  IN-008: "未经验证的用户备注直接写入持久记忆，后续会话仍会读取并使用。"
  IN-009: "用户消息直接到模型且未声明‘仅作为数据’，形成直接注入面；无高后果能力时只作加固项。"

  LLM-001: "system/developer 消息模板插入用户变量即确认边界违规；放在 user 消息的数据字段则不命中。"
  LLM-002: "网页抓取结果直接进入模型 Prompt，系统指令未说明外部内容不得作为指令执行。"
  LLM-003: "知识检索内容进入可调用退款工具的模型，且没有确定性策略门，形成间接注入到工具链。"
  LLM-004: "Prompt 中出现可识别的真实 API 密钥字面量，确认模型上下文暴露凭证。"
  LLM-005: "模型自由文本直接填充转账 amount 与 recipient；严格 Schema 和 Allowlist 均缺失。"
  LLM-006: "模型输出被解析为发布工具参数，但 structured_output_schema 未声明，可能发生参数走私。"
  LLM-007: "Prompt 明确要求模型判断用户是否有权删除项目，把访问控制委托给概率模型。"
  LLM-008: "模型可以触发正式发布，路径上没有对象授权、策略门或业务必要的人工确认。"
  LLM-009: "自主 Agent 可调用工具但未配置最大轮次、Token、超时和重试预算，诱导循环会放大成本。"
  LLM-010: "模型解析失败后使用 allow=true 的默认值继续调用工具，失败没有关闭风险路径。"
  LLM-011: "system Prompt 内包含具体 bearer token；Secret Manager 引用或占位符不命中。"
  LLM-012: "DSL 只写 OpenAI-compatible provider 而没有实际 endpoint，无法判断数据运营主体，只记覆盖缺口。"

  TOOL-001: "自定义插件没有内部能力登记，扫描器无法判断它是否联网、写入或执行，只记覆盖缺口。"
  TOOL-002: "模型生成的 role 与 user_id 直接进入授权工具，敏感参数没有 Allowlist 或对象授权。"
  TOOL-003: "HTTP 节点 URL 由用户变量控制，且未限制 scheme、域名和私网 IP，形成 SSRF 面。"
  TOOL-004: "用户变量被拼入 shell_command 字段；固定代码函数只把变量当数据处理不命中。"
  TOOL-005: "查询文本写成 SELECT * FROM orders WHERE id='{{id}}' 且无参数绑定，形成 SQL 注入面。"
  TOOL-006: "用户提供 filename 并直接拼接到文件路径，没有固定根目录，../ 可尝试越界。"
  TOOL-007: "客户合同正文进入第三方翻译插件请求体，缺少出站最小化或 DLP。"
  TOOL-008: "删除知识库工具可从输入直达且无不可绕过授权；工具端对象级鉴权可作为反证。"
  TOOL-009: "通用 admin_action 工具未声明允许操作范围，无法核对其是否超出工作流业务目的。"
  TOOL-010: "HTTP header 中硬编码真实 Authorization 密钥；secret 引用不命中。"
  TOOL-011: "模型参数进入工单创建工具，但参数对象允许额外字段且无严格类型约束。"
  TOOL-012: "未知插件输出自由文本直接进入 LLM，恶意插件响应可伪造指令；严格输出 Schema 可排除。"
  TOOL-013: "未登记的远程工具没有 timeout，响应挂起可能阻塞工作流；平台强制超时则只记覆盖。"
  TOOL-014: "第三方插件未固定版本、来源或完整性摘要，更新后能力可能被替换。"
  TOOL-015: "更新合同工具只验证登录态，不验证 subject-object-action，改写 contract_id 可跨租户修改。"
  TOOL-016: "用户输入 tenant_id 直接传给读取账单工具；若工具按会话重新绑定租户则不命中。"
  TOOL-017: "模型可控制 webhook 目标且敏感字段进入 body，无必经出站策略，形成动态外传通道。"

  OUT-001: "End 输出 object 供 API 自动消费却没有严格 Schema；仅供人阅读的普通文本不适用。"
  OUT-002: "身份证号被输出到匿名公开页面；仅返回给当前已授权调用方的 Answer 不默认算外泄。"
  OUT-003: "错误输出模板包含完整 system Prompt 或调试栈，触发失败即可暴露内部上下文。"
  OUT-004: "模型内容以未净化 HTML 插入页面，攻击文本 <img onerror=...> 可形成 XSS。"
  OUT-005: "模型生成的 URL 被渲染为可点击链接，协议与域名未限制，可生成钓鱼或 javascript: 链接。"
  OUT-006: "模型 JSON 未经 Schema 验证直接进入执行节点；仅在终端展示则不适用。"
  OUT-007: "合规决策要求引用证据，但 RAG 输出未绑定文档来源和片段，无法追溯投毒内容。"
  OUT-008: "机器自动采纳模型质检结论，低置信或解析失败时仍默认通过，没有失败关闭。"
  OUT-009: "模型可生成 Markdown 图片目标且浏览器会自动取链，缺少域名代理或 CSP；需动态确认渲染行为。"
  OUT-010: "模型输出‘已审批，可立即付款’却没有审批 ID、签名或来源绑定，可能伪造权威声明。"
  OUT-011: "结构化 End 结果可能被业务系统自动执行，但 DSL 未声明调用方认证与消费方式，只记覆盖缺口。"

  KB-001: "dataset_id 使用 {{tenant.dataset}} 动态模板且无 Allowlist，攻击者可改写检索范围。"
  KB-002: "多租户知识库检索只传 query，不带稳定租户过滤，可能跨业务检索数据。"
  KB-003: "敏感知识检索 top_k=1000 且阈值极低，过多片段进入可执行链，扩大泄露和投毒面。"
  KB-004: "检索文档原文被插入 system Prompt，知识投毒内容进入高权限指令区，静态确认为 MEDIUM。"
  KB-005: "知识内容进入可调用发信工具的模型，且无确定性动作门，投毒文档可影响副作用。"
  KB-006: "已分类为内部机密的知识片段进入外部 webhook；只凭数据集标题猜测敏感性不足以确认。"
  KB-007: "外部网页抓取结果未经审核直接写入可信知识库，后续检索会持续返回污染内容。"
  KB-008: "医疗建议要求来源证明，但知识节点没有文档 ID、版本或引用元数据。"
  KB-009: "知识检索→LLM→删除工具之间没有隔离或策略门，形成投毒到副作用完整路径。"
  KB-010: "DSL 声明使用受监管外部知识，但 ACL、保留和撤销状态不可见，只能记录治理覆盖缺口。"
  KB-011: "持久记忆键只用 memory，不含 user/tenant/session，A 用户内容可能被 B 用户读到。"
  KB-012: "用户输入可写入长期记忆，后续 Agent 自动读取，单次投毒能跨回合持续影响目标。"
