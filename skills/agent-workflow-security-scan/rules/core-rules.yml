schema_version: 1.0.0
rule_defaults:
  applicability: internal_dify_workflow
  confidence_policy: deterministic_evidence_or_hybrid_downgrade
  evidence_policy: fact_id_node_id_and_dsl_pointer
  remediation_family: auto_by_rule_prefix
  dynamic_test_template: null
  references:
    - https://github.com/Tencent/AI-Infra-Guard/tree/main/agent-scan
    - https://github.com/ethz-spylab/agentdojo
    - https://github.com/invariantlabs-ai/invariant
    - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  provenance: "Rule semantics independently adapted for static Dify DSL analysis; no upstream prompt text is embedded."
calibration_policy:
  risk_key: responsible_node_plus_control_domain
  require_capability_and_path_for_security_finding: true
  read_only_external_tool_is_not_high_impact_sink: true
  fixed_sandbox_code_inputs_are_data_not_commands: true
  human_approval_is_not_universally_required: true
  accepted_action_gates: [human_confirmation, deterministic_authorization, policy_engine, object_level_authorization, parameter_allowlist]
  runtime_unknown_is_coverage_not_confirmed_vulnerability: true
  missing_hardening_is_reported_only_when_impact_context_applies: true
control_domains:
  structure_coverage: [FLOW-001, FLOW-002]
  input_contract: [IN-001, IN-002, IN-003, IN-004, IN-005, IN-006]
  instruction_boundary: [IN-007, IN-009, LLM-001, LLM-002, KB-004]
  memory_identity_scope: [IN-008, KB-007, KB-011, KB-012]
  untrusted_content_boundary: [FLOW-005, LLM-003, KB-005, KB-009, TOOL-012]
  action_authorization: [FLOW-003, FLOW-006, LLM-007, LLM-008, TOOL-002, TOOL-008, TOOL-015, TOOL-016]
  data_protection: [FLOW-004, FLOW-008, LLM-004, LLM-011, TOOL-007, TOOL-010, OUT-002, OUT-003, KB-006]
  egress_control: [FLOW-009, TOOL-003, TOOL-017, OUT-009]
  execution_boundary: [FLOW-010, TOOL-004, TOOL-005, TOOL-006]
  structured_data_contract: [FLOW-011, LLM-005, LLM-006, TOOL-011, OUT-001, OUT-006]
  resilience_budget: [FLOW-007, FLOW-012, LLM-009, LLM-010, TOOL-001, TOOL-009, TOOL-013, OUT-008]
  output_safety: [OUT-004, OUT-005, OUT-007, OUT-010]
  knowledge_governance: [KB-001, KB-002, KB-003, KB-008, KB-010]
  supply_chain: [TOOL-014]
  agent_governance: [FLOW-013]
rules:
  - {id: FLOW-001, title: "断裂节点或变量引用", severity: MEDIUM, detectability: S, standards: [AISVS-C9]}
  - {id: FLOW-002, title: "未知节点造成扫描盲区", severity: MEDIUM, detectability: S, standards: [AISVS-C9]}
  - {id: FLOW-003, title: "不可信输入到高危工具", severity: HIGH, detectability: S, standards: [AISVS-9.2, ASI02]}
  - {id: FLOW-004, title: "敏感数据可达外部边界", severity: HIGH, detectability: H, standards: [AISVS-C7, ASI03]}
  - {id: FLOW-005, title: "间接 Prompt Injection 工具链", severity: HIGH, detectability: H, standards: [ASI01, AISVS-9.3]}
  - {id: FLOW-006, title: "审批或过滤可绕过", severity: HIGH, detectability: S, standards: [AISVS-9.2, ASI02, ASI03]}
  - {id: FLOW-007, title: "无界循环或级联调用", severity: MEDIUM, detectability: S, standards: [AISVS-9.1, ASI08]}
  - {id: FLOW-008, title: "凭证进入模型可见上下文", severity: CRITICAL, detectability: S, standards: [AISVS-9.5.4, ASI03]}
  - {id: FLOW-009, title: "敏感资产经模型到外部通道的复合外泄链", severity: CRITICAL, detectability: S, standards: [ASI01, ASI03], attack_family: web_exfiltration}
  - {id: FLOW-010, title: "外部不可信内容经模型到代码执行", severity: CRITICAL, detectability: S, standards: [ASI01, ASI05], attack_family: unexpected_code_execution}
  - {id: FLOW-011, title: "跨 Agent 消息缺少结构与信任校验", severity: HIGH, detectability: S, standards: [ASI07], attack_family: inter_agent_communication}
  - {id: FLOW-012, title: "多级副作用链缺少故障隔离", severity: HIGH, detectability: H, standards: [ASI08, AISVS-9.1], attack_family: cascading_failure}
  - {id: FLOW-013, title: "自主 Agent 缺少目标锁定和紧急停止边界", severity: HIGH, detectability: H, standards: [ASI10, AISVS-9.1], attack_family: rogue_agent}

  - {id: IN-001, title: "输入字段缺少明确类型", severity: MEDIUM, detectability: S, standards: [AISVS-C2]}
  - {id: IN-002, title: "进入循环或副作用路径的输入缺少上限", severity: MEDIUM, detectability: S, standards: [AISVS-C2], applies_to: [file_or_collection_input, text_reaching_loop_or_side_effect], exclusion_facts: [bounded_single_step_text_workflow]}
  - {id: IN-003, title: "文件上传约束不足", severity: HIGH, detectability: S, standards: [AISVS-C2]}
  - {id: IN-004, title: "未声明输入规范化", severity: LOW, detectability: M, standards: [AISVS-C2], root_cause_family: input_canonicalization, requires_dynamic_validation: true}
  - {id: IN-005, title: "对象输入允许未知字段", severity: MEDIUM, detectability: S, standards: [AISVS-C2]}
  - {id: IN-006, title: "敏感输入缺少保护", severity: HIGH, detectability: H, standards: [AISVS-C2, AISVS-C7]}
  - {id: IN-007, title: "用户输入进入高权限 Prompt", severity: MEDIUM, detectability: S, standards: [ASI01], root_cause_family: prompt_boundary, requires_dynamic_validation: true}
  - {id: IN-008, title: "未验证输入被持久化", severity: HIGH, detectability: H, standards: [AISVS-C8]}
  - {id: IN-009, title: "直接 Prompt Injection 可达模型", severity: MEDIUM, detectability: S, standards: [ASI01], attack_family: direct_prompt_injection, root_cause_family: prompt_boundary, requires_dynamic_validation: true}

  - {id: LLM-001, title: "不可信变量进入系统指令", severity: MEDIUM, detectability: S, standards: [ASI01], root_cause_family: prompt_boundary, requires_dynamic_validation: true}
  - {id: LLM-002, title: "指令与外部数据未隔离", severity: MEDIUM, detectability: H, standards: [ASI01], root_cause_family: prompt_boundary, requires_dynamic_validation: true}
  - {id: LLM-003, title: "间接内容可控制工具", severity: HIGH, detectability: S, standards: [ASI01, ASI02]}
  - {id: LLM-004, title: "密钥或内部上下文暴露", severity: CRITICAL, detectability: S, standards: [ASI03]}
  - {id: LLM-005, title: "自由文本直接控制工具", severity: HIGH, detectability: S, standards: [AISVS-9.3]}
  - {id: LLM-006, title: "下游依赖结构化数据但无输出 Schema", severity: HIGH, detectability: S, standards: [AISVS-C7]}
  - {id: LLM-007, title: "模型承担授权决策", severity: HIGH, detectability: H, standards: [AISVS-9.5.3, ASI03]}
  - {id: LLM-008, title: "高影响决策无确定性复核", severity: HIGH, detectability: S, standards: [AISVS-9.2]}
  - {id: LLM-009, title: "自主或副作用路径的模型资源预算不完整", severity: MEDIUM, detectability: S, standards: [AISVS-9.1], applies_to: [autonomous_agent, llm_reaching_side_effect], exclusion_facts: [single_step_text_only_llm]}
  - {id: LLM-010, title: "副作用路径的模型失败回退不明确", severity: MEDIUM, detectability: H, standards: [AISVS-9.6], applies_to: [llm_reaching_side_effect], exclusion_facts: [human_readable_text_only_output]}
  - {id: LLM-011, title: "系统指令敏感内容存在泄露面", severity: HIGH, detectability: H, standards: [ASI03], attack_family: data_leakage}

  - {id: TOOL-001, title: "工具能力无法确定", severity: MEDIUM, detectability: H, standards: [AISVS-9.3]}
  - {id: TOOL-002, title: "高危工具参数由模型控制", severity: HIGH, detectability: S, standards: [AISVS-9.5]}
  - {id: TOOL-003, title: "可控 URL 形成 SSRF 风险", severity: HIGH, detectability: S, standards: [ASI02]}
  - {id: TOOL-004, title: "命令或代码注入风险", severity: CRITICAL, detectability: S, standards: [ASI05]}
  - {id: TOOL-005, title: "SQL 或查询注入风险", severity: HIGH, detectability: S, standards: [ASI02]}
  - {id: TOOL-006, title: "动态文件路径缺少目录约束", severity: HIGH, detectability: S, standards: [ASI02]}
  - {id: TOOL-007, title: "敏感数据通过工具外传", severity: HIGH, detectability: H, standards: [ASI03]}
  - {id: TOOL-008, title: "高后果操作缺少必经授权或策略门", severity: HIGH, detectability: S, standards: [AISVS-9.2], applies_to: [irreversible_privileged_or_dynamic_code_action], exclusion_facts: [mandatory_deterministic_policy_gate, object_level_authorization, business_required_human_confirmation]}
  - {id: TOOL-009, title: "工具能力超出业务目的", severity: MEDIUM, detectability: H, standards: [ASI02]}
  - {id: TOOL-010, title: "工具凭证处理不安全", severity: CRITICAL, detectability: S, standards: [AISVS-9.5.4, ASI03]}
  - {id: TOOL-011, title: "工具输入缺少严格 Schema", severity: MEDIUM, detectability: S, standards: [AISVS-9.3]}
  - {id: TOOL-012, title: "工具输出未经验证进入模型", severity: HIGH, detectability: S, standards: [AISVS-9.3]}
  - {id: TOOL-013, title: "长耗时或副作用工具的超时保证不可见", severity: LOW, detectability: M, standards: [AISVS-9.1], applies_to: [effectful_or_unknown_unregistered_tool], exclusion_facts: [trusted_registry_runtime_timeout]}
  - {id: TOOL-014, title: "第三方或未知工具供应链不可验证", severity: HIGH, detectability: M, standards: [ASI04, AISVS-C10], applies_to: [third_party_plugin, unknown_tool_capability], exclusion_facts: [trusted_versioned_integrity_registry]}
  - {id: TOOL-015, title: "高影响工具缺少对象级授权约束", severity: HIGH, detectability: H, standards: [ASI03, AISVS-9.5.3], attack_family: authorization_bypass}
  - {id: TOOL-016, title: "用户可控身份或资源标识直达工具", severity: HIGH, detectability: S, standards: [ASI03], attack_family: authorization_bypass}
  - {id: TOOL-017, title: "敏感载荷与动态网络目标形成外带通道", severity: CRITICAL, detectability: S, standards: [ASI03], attack_family: web_exfiltration}

  - {id: OUT-001, title: "结构化输出契约不足", severity: LOW, detectability: S, standards: [AISVS-C7], applies_to: [structured_output, machine_consumed_structured_output], exclusion_facts: [human_readable_free_text_output], escalation: "MEDIUM when DSL declares machine/API/decision consumption"}
  - {id: OUT-002, title: "敏感信息可达外部输出", severity: HIGH, detectability: H, standards: [AISVS-C7]}
  - {id: OUT-003, title: "系统 Prompt 或内部信息泄露", severity: HIGH, detectability: S, standards: [ASI03]}
  - {id: OUT-004, title: "富文本输出缺少上下文编码", severity: HIGH, detectability: S, standards: [AISVS-C7]}
  - {id: OUT-005, title: "模型生成危险链接或协议", severity: MEDIUM, detectability: S, standards: [AISVS-C7]}
  - {id: OUT-006, title: "未验证输出进入下游执行者", severity: HIGH, detectability: S, standards: [AISVS-C7, ASI07]}
  - {id: OUT-007, title: "高信任 RAG 输出引用不可追踪", severity: MEDIUM, detectability: S, standards: [AISVS-C7], applies_to: [regulated_or_verified_rag_output], exclusion_facts: [ordinary_unregulated_knowledge_answer]}
  - {id: OUT-008, title: "低置信或失败输出无回退", severity: MEDIUM, detectability: H, standards: [AISVS-C7], applies_to: [end_to_end_failure_path], exclusion_facts: [upstream_default_or_fail_closed_strategy]}
  - {id: OUT-009, title: "动态 Markdown 链接或图片可形成隐蔽外带", severity: HIGH, detectability: S, standards: [ASI03, AISVS-C7], attack_family: web_exfiltration}
  - {id: OUT-010, title: "面向人的高信任声明缺少来源证明", severity: MEDIUM, detectability: H, standards: [ASI09], attack_family: human_agent_trust_exploit}

  - {id: KB-001, title: "知识数据集范围可被动态改写", severity: HIGH, detectability: S, standards: [AISVS-8.1], applies_to: [dynamic_or_wildcard_dataset_scope], exclusion_facts: [static_dataset_ids, empty_dataset_configuration_error]}
  - {id: KB-002, title: "动态或多业务知识范围缺少分区过滤", severity: HIGH, detectability: S, standards: [AISVS-8.1], applies_to: [dynamic_dataset_scope, sensitive_multi_dataset_scope], exclusion_facts: [static_single_dataset]}
  - {id: KB-003, title: "敏感或副作用 RAG 的检索范围过宽", severity: MEDIUM, detectability: S, standards: [AISVS-C8], applies_to: [sensitive_knowledge, retrieval_reaching_side_effect], exclusion_facts: [ordinary_public_read_only_rag]}
  - {id: KB-004, title: "知识内容进入高权限 Prompt", severity: HIGH, detectability: S, standards: [ASI01]}
  - {id: KB-005, title: "知识内容经模型控制工具", severity: HIGH, detectability: S, standards: [ASI01, ASI02]}
  - {id: KB-006, title: "知识敏感内容可达外部边界", severity: HIGH, detectability: H, standards: [AISVS-C8]}
  - {id: KB-007, title: "未验证内容写入可信记忆", severity: HIGH, detectability: H, standards: [AISVS-8.2.3]}
  - {id: KB-008, title: "高信任知识决策缺少来源元数据", severity: MEDIUM, detectability: S, standards: [AISVS-C7, AISVS-C12], applies_to: [regulated_or_verified_output], exclusion_facts: [ordinary_knowledge_answer]}
  - {id: KB-009, title: "知识到副作用路径缺少注入隔离", severity: HIGH, detectability: H, standards: [AISVS-8.2], applies_to: [knowledge_to_llm_to_side_effect], exclusion_facts: [read_only_rag, mandatory_action_gate]}
  - {id: KB-010, title: "声明需治理的知识库运行控制不可见", severity: INFO, detectability: M, standards: [AISVS-C8], applies_to: [regulated_or_external_knowledge_declared], exclusion_facts: [ordinary_static_knowledge_base]}
  - {id: KB-011, title: "持久记忆缺少用户或租户命名空间", severity: HIGH, detectability: S, standards: [ASI06, AISVS-8.1], attack_family: memory_poisoning}
  - {id: KB-012, title: "不可信写入可被后续 Agent 读取", severity: HIGH, detectability: S, standards: [ASI06, ASI07], attack_family: memory_poisoning}
